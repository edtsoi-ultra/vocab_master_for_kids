<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🐷 蔡諾琳 2A 學校專頁</title>
<style>
* { margin:0; padding:0; box-sizing:border-box;}
body {
font-family: -apple-system, "PingFang HK", "Noto Sans TC", sans-serif;
background: linear-gradient(160deg, #0F172A 0%, #1E293B 100%);
color: #F8FAFC; min-height: 100vh; padding: 18px 14px 40px;
}
.wrap { max-width: 640px; margin: 0 auto;}
header { margin: 6px 2px 16px;}
header h1 { font-size: 24px; font-weight: 900;}
header.sub { color: #94A3B8; font-size: 13px; margin-top: 4px;}
h2 { font-size: 17px; margin: 22px 2px 10px;}
.card {
background: rgba(30,41,59,.92); border: 1px solid rgba(148,163,184,.28);
border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
}
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;}
.chip {
display: inline-block; padding: 2px 10px; border-radius: 999px;
font-size: 12px; font-weight: 800; color: #fff;
}
.t-評估 { background:#F43F5E;}.t-默書 { background:#2563EB;}
.t-進評 { background:#9333EA;}.t-小測 { background:#0D9488;}
.t-測驗 { background:#CA8A04;}.t-其他 { background:#475569;}
.subj { font-weight: 800; font-size: 16px;}
.ttl { font-size: 16px;}
.when { margin-left: auto; text-align: right;}
.date { color: #CBD5E1; font-size: 13px;}
.cd { font-weight: 900; font-size: 14px;}
.cd-hot { color: #FB7185;}.cd-warm { color: #FBBF24;}.cd-ok { color: #34D399;}
.tier { margin-top: 8px; font-size: 12.5px; font-weight: 700;}
.tier-verified { color: #34D399;}.tier-kb { color: #7DD3FC;}.tier-guess { color: #FBBF24;}
.block { margin-top: 10px; border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.55;}
.block.lab { display:block; font-size: 12px; font-weight: 800; letter-spacing:.06em; margin-bottom: 4px;}
.scope { background: rgba(15,23,42,.85); border: 1px solid rgba(148,163,184,.22);}
.scope.lab { color: #7DD3FC;}
.detail { background: rgba(15,23,42,.85); border: 1px solid rgba(196,181,253,.35);}
.detail.lab { color: #C4B5FD;}
.points { background: rgba(15,23,42,.85); border: 1px solid rgba(148,163,184,.22);}
.points.lab { color: #F0ABFC;}
.points li,.hints li { margin-left: 18px;}
.focus { background: rgba(244,63,94,.08); border: 1px solid rgba(244,63,94,.4);}
.focus.lab { color: #FB7185;}
.focus li { margin-left: 18px;}
.words { background: rgba(37,99,235,.10); border: 1px solid rgba(59,130,246,.45);}
.words.lab { color: #93C5FD;}
.word { display: inline-block; background: rgba(15,23,42,.7); border: 1px solid rgba(147,197,253,.4);
border-radius: 8px; padding: 3px 9px; margin: 2px 3px 2px 0; font-size: 15px;}
.word.mean { color: #93C5FD; font-size: 12.5px; margin-left: 5px;}
.word.syl { color: #64748B; font-size: 11.5px; margin-left: 4px;}
.sent { background: rgba(37,99,235,.06); border: 1px solid rgba(59,130,246,.3);}
.sent.lab { color: #93C5FD;}
.sent li { margin-left: 18px;}
.speak {
display: inline-block; margin-top: 8px; padding: 7px 14px; border-radius: 999px;
background: #2563EB; color: #fff; font-size: 14px; font-weight: 800;
border: none; cursor: pointer;
}
.speak:active { background: #1D4ED8;}
.prog { margin-left: 10px; font-size: 13.5px; font-weight: 800; color: #FBBF24; }
.hints { background: rgba(245,158,11,.10); border: 1px solid rgba(245,158,11,.45);}
.hints.lab { color: #FBBF24;}
.practice { background: rgba(16,185,129,.08); border: 1px solid rgba(16,185,129,.4);}
.practice.lab { color: #34D399;}
.practice.psub { font-weight: 800; margin: 6px 0 2px; color: #A7F3D0;}
.practice li { margin-left: 18px;}
details.key { margin-top: 8px;}
details.key summary { color: #FBBF24; font-size: 13.5px; font-weight: 800; cursor: pointer;}
details.key.ans { color: #FDE68A; margin-top: 4px;}
details.key li { margin-left: 18px;}
.empty { color: #94A3B8; font-size: 14px; padding: 6px 2px;}
footer { color: #64748B; font-size: 12px; margin-top: 24px; text-align: center;}
.err { color: #FB7185; font-size: 14px;}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🐷 <span id="student">蔡諾琳</span> 學校專頁</h1>
<div class="sub" id="updated">載入中…</div>
</header>
<div id="app"></div>
<footer>資料每日自動更新（06:30）＋ eClass／Classroom 檢查後同步・學校原文與 AI 輔助（提示／練習）分開標示</footer>
</div>
<script>
function el(tag, cls, text) {
const e = document.createElement(tag);
if (cls) e.className = cls;
if (text!= null) e.textContent = text;
return e;
}
function cdText(days) {
if (days <= 0) return "今日！";
if (days === 1) return "聽日";
return days + " 日後";
}
function cdClass(days) { return days <= 0? "cd-hot": (days <= 3? "cd-warm": "cd-ok");}
function block(cls, lab) {
const b = el("div", "block " + cls);
b.appendChild(el("span", "lab", lab));
return b;
}
let speakingBtn = null;
function speakSeq(texts, lang, btn, prog) {
if (!("speechSynthesis" in window)) { btn.textContent = "此瀏覽器不支援語音"; return; }
if (speakingBtn === btn) { speechSynthesis.cancel(); speakingBtn = null; btn.textContent = btn.dataset.label; if (prog) prog.textContent = ""; return; }
speechSynthesis.cancel();
if (speakingBtn) speakingBtn.textContent = speakingBtn.dataset.label;
speakingBtn = btn;
btn.dataset.label = btn.textContent;
btn.textContent = "⏹ 停止讀默";
let i = 0;
function alive() { return speakingBtn === btn; }
function finish() {
if (!alive()) return;
speakingBtn = null;
btn.textContent = btn.dataset.label;
if (prog) prog.textContent = "✅ 讀默完成";
}
function say(text, cb) {
const u = new SpeechSynthesisUtterance(text);
u.lang = lang; u.rate = 0.78;
u.onend = cb; u.onerror = cb;
speechSynthesis.speak(u);
}
function playItem() {
if (!alive()) return;
if (i >= texts.length) { finish(); return; }
if (prog) prog.textContent = "🔊 讀默中：第 " + (i + 1) + " / " + texts.length + " 題";
say(texts[i], () => setTimeout(() => {
if (!alive()) return;
say(texts[i], () => setTimeout(() => { i++; playItem(); }, 6000));
}, 2000));
}
playItem();
}
function langOf(item) { return item.subject === "英文"? "en-GB": "zh-HK";}

function addEnrichment(parent, item) {
if (item.source_tier) {
const map = {
verified_capture: ["tier-verified", "✅ 已核實內容（學校原文／上傳圖片）"],
curriculum_kb: ["tier-kb", "📚 按已存課本內容生成"],
scope_guess: ["tier-guess", item.flag || "⚠️ 基礎範圍練習（待補充課本／默書紙圖片以生成精準字表）"]
};
const m = map[item.source_tier];
if (m) parent.appendChild(el("div", "tier " + m[0], m[1]));
}
if (item.scope) {
const b = block("scope", "📚 溫書範圍"); b.appendChild(el("div", null, item.scope)); parent.appendChild(b);
}
if (item.detail) {
const b = block("detail", "📋 內容／指示（學校原文）"); b.appendChild(el("div", null, item.detail)); parent.appendChild(b);
}
if (item.points && item.points.length) {
const b = block("points", "📌 要點");
const ul = el("ul"); item.points.forEach(p => ul.appendChild(el("li", null, p)));
b.appendChild(ul); parent.appendChild(b);
}
if (item.focus_points && item.focus_points.length) {
const b = block("focus", "🎯 重點注意");
const ul = el("ul"); item.focus_points.forEach(p => ul.appendChild(el("li", null, p)));
b.appendChild(ul); parent.appendChild(b);
}
if (item.words && item.words.length) {
const b = block("words", "🔤 字詞表");
item.words.forEach(w => {
const s = el("span", "word", w.text);
if (w.meaning) s.appendChild(el("span", "mean", w.meaning));
if (w.syllables) s.appendChild(el("span", "syl", w.syllables));
b.appendChild(s);
});
const btn = el("button", "speak", "🔊 讀默字詞");
const prog = el("span", "prog");
btn.addEventListener("click", () => speakSeq(item.words.map(w => w.text), langOf(item), btn, prog));
b.appendChild(el("br")); b.appendChild(btn); b.appendChild(prog);
parent.appendChild(b);
}
if (item.sentences && item.sentences.length) {
const b = block("sent", "🗣 讀默句子");
const ol = el("ol"); item.sentences.forEach(s => ol.appendChild(el("li", null, s)));
b.appendChild(ol);
const btn = el("button", "speak", "🔊 讀默句子");
const prog = el("span", "prog");
btn.addEventListener("click", () => speakSeq(item.sentences, langOf(item), btn, prog));
b.appendChild(btn); b.appendChild(prog);
parent.appendChild(b);
}
if (item.hints && item.hints.length) {
const b = block("hints", "💡 提示・方向（AI 輔助）");
const ul = el("ul"); item.hints.forEach(h => ul.appendChild(el("li", null, h)));
b.appendChild(ul); parent.appendChild(b);
}
if (item.practice && item.practice.length) {
const b = block("practice", "✏️ 練習題（AI 按範圍生成）");
let curSubj = null, list = null;
item.practice.forEach(p => {
if (p.subject && p.subject!== curSubj) {
curSubj = p.subject;
b.appendChild(el("div", "psub", ""));
list = el("ol"); b.appendChild(list);
}
if (!list) { list = el("ol"); b.appendChild(list);}
list.appendChild(el("li", null, p.q));
});
const det = el("details", "key");
det.appendChild(el("summary", null, "🔑 家長核對答案"));
const al = el("ol");
item.practice.forEach(p => { if (p.a) al.appendChild(el("li", "ans", p.a));});
det.appendChild(al);
b.appendChild(det);
parent.appendChild(b);
}
if (item.answer_key) {
const det = el("details", "key");
det.appendChild(el("summary", null, "🔑 家長核對（問功課紀錄）"));
det.appendChild(el("div", "ans", item.answer_key));
parent.appendChild(det);
}
}

fetch("daughter-detail.json?t=" + Date.now())
.then(r => r.json())
.then(d => {
document.getElementById("student").textContent = d.student || "蔡諾琳 2A";
document.getElementById("updated").textContent = "更新：" + (d.updated || "").replace("T", " ").slice(0, 16);
const app = document.getElementById("app");

app.appendChild(el("h2", null, "📅 考試・默書・評估"));
if (!d.upcoming ||!d.upcoming.length) app.appendChild(el("div", "empty", "暫時冇已記錄嘅測驗或評估。"));
(d.upcoming || []).forEach(u => {
const c = el("div", "card");
const r = el("div", "row");
r.appendChild(el("span", "chip t-" + (u.type || "其他"), u.type || ""));
r.appendChild(el("span", "subj", u.subject || ""));
r.appendChild(el("span", "ttl", u.title || ""));
const w = el("div", "when");
w.appendChild(el("div", "date", u.date_display || u.date || ""));
w.appendChild(el("div", "cd " + cdClass(u.days_left), cdText(u.days_left)));
r.appendChild(w);
c.appendChild(r);
addEnrichment(c, u);
app.appendChild(c);
});

app.appendChild(el("h2", null, "📝 未交功課"));
if (!d.homework ||!d.homework.length) app.appendChild(el("div", "empty", "冇未交功課 🎉"));
(d.homework || []).forEach(hw => {
const c = el("div", "card");
const r = el("div", "row");
r.appendChild(el("span", "subj", hw.subject || ""));
r.appendChild(el("span", "ttl", hw.title || ""));
const w = el("div", "when");
w.appendChild(el("div", "date", "交：" + (hw.due_display || hw.due || "")));
w.appendChild(el("div", "cd " + cdClass(hw.days_left), cdText(hw.days_left)));
r.appendChild(w);
c.appendChild(r);
addEnrichment(c, hw);
app.appendChild(c);
});

const items = (d.notices && d.notices.items) || [];
app.appendChild(el("h2", null, "📢 通告（未簽／處理中）"));
if (!items.length) app.appendChild(el("div", "empty", "冇待處理通告。"));
items.forEach(n => {
const c = el("div", "card notice");
const r = el("div", "row");
r.appendChild(el("span", "ttl", n.brief || n.title || ""));
const w = el("div", "when");
w.appendChild(el("div", "date", "限期：" + (n.deadline_display || n.deadline || "")));
w.appendChild(el("div", "cd " + cdClass(n.days_left), cdText(n.days_left)));
r.appendChild(w);
c.appendChild(r);
addEnrichment(c, n);
app.appendChild(c);
});
})
.catch(e => {
document.getElementById("updated").innerHTML = '<span class="err">載入失敗，請稍後再試。</span>';
});
</script>
</body>
</html>
