<body>
<header><h1>🐷 蔡諾琳學校專頁</h1><span class="badge">2A</span></header>
<div class="sub" id="upd">載入中…</div>
<nav id="topnav"><button class="navbtn on" data-filter="all">全部</button><button class="navbtn" data-filter="exam">⏰ 測驗 <span id="cntExam"></span></button><button class="navbtn" data-filter="hw">📝 功課 <span id="cntHw"></span></button><button class="navbtn" data-filter="notice">📢 通告 <span id="cntNotice"></span></button><button class="navbtn collapseall" id="collapseAll">↕️</button></nav>
<div id="actionBanner"></div>
<div id="quizBanner"><button id="quizOpenBtn">🧪 互動練習 Demo：第3課《心中的鈴鐺》<br>㩒入去玩 — 選擇題・配對・拖放分類・畫畫寫字</button></div>
<div id="app"></div>
<div id="quizModal"><div class="qz-bar"><span id="qzScore">⭐ 0 / 12</span><button class="ws-close" id="quizCloseBtn">✕ 關閉</button></div><div class="qz-wrap" id="qzBody"></div></div>
<div id="wsModal"><div class="ws-bar"><button class="ws-print" id="wsPrintBtn">🖨️ 列印 / 儲存 PDF</button><button class="ws-close" id="wsCloseBtn">✕ 關閉</button></div><div id="wsSheet"></div></div>
<footer>資料來源：學校 eClass 通告及通告附頁、Google Classroom 功課指示、課本/默書紙拍攝內容。<br>「學校原文」為官方內容；「AI 輔助」提示同練習由 Muse 生成，練習答案只供家長核對。</footer>
<script>
const $app = document.getElementById("app");
const ITEMS = {};
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function htmlAware(parent, content) { if (content && content.indexOf("<") >= 0) { const s = el("span"); s.innerHTML = content; parent.appendChild(s); } else parent.appendChild(document.createTextNode(content || "")); }
function dueLabel(item) {
  const dl = item.days_left;
  if (dl == null) return "";
  if (!(item.due || item.date || item.deadline)) return "";
  if (dl < 0) return "已完成";
  if (dl === 0) return "今日！";
  if (dl === 1) return "聽日！";
  return dl + " 日後";
}
function dueClass(item) { const dl = item.days_left; if (dl == null) return "ok"; if (dl < 0) return "done"; if (dl === 0) return "soon"; if (dl === 1) return "tmr"; if (dl <= 3) return "warn"; return "ok"; }
function langOf(item) { return (item.subject === "英文" || item.subject === "English") ? "en-GB" : "zh-HK"; }
function tierBadge(item, compactGuess) {
  if (!item.source_tier) return null;
  if (item.source_tier === "verified_capture") return el("span", "tier verified", "✅ 已核實內容");
  if (item.source_tier === "curriculum_kb") return el("span", "tier kb", "📚 按課本內容生成");
  return el("span", "tier guess", compactGuess ? "⚠️ 待傳相片" : "⚠️ 基礎範圍練習");
}
/* ---------- 日期重算（前端，香港時間；唔信後端靜態 days_left） ---------- */
function hkTodayStr() {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Hong_Kong", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
  const o = {};
  parts.forEach(p => { o[p.type] = p.value; });
  return o.year + "-" + o.month + "-" + o.day;
}
function dayNumOf(y, m, d) { return Date.UTC(y, m - 1, d) / 86400000; }
function parseItemDay(item) {
  const isoFields = [item.date, item.due, item.deadline];
  for (const v of isoFields) {
    if (v && /^\d{4}-\d{2}-\d{2}/.test(v)) { const a = v.slice(0, 10).split("-"); return dayNumOf(+a[0], +a[1], +a[2]); }
  }
  const t = hkTodayStr().split("-");
  const todayDn = dayNumOf(+t[0], +t[1], +t[2]);
  const texts = [item.date_display, item.due_display, item.deadline_display, item.date, item.due, item.deadline];
  for (const v of texts) {
    if (!v) continue;
    const m = /(\d{1,2})月(\d{1,2})日/.exec(v);
    if (m) {
      let dn = dayNumOf(+t[0], +m[1], +m[2]);
      if (todayDn - dn > 60) dn = dayNumOf(+t[0] + 1, +m[1], +m[2]);
      return dn;
    }
  }
  return null;
}
function fixDaysLeft(item) {
  const dn = parseItemDay(item);
  if (dn != null) { const t = hkTodayStr().split("-"); item.days_left = Math.round(dn - dayNumOf(+t[0], +t[1], +t[2])); }
}
/* ---------- 學習進度（localStorage） ---------- */
const PROG_LSK = "daughter-progress-v1";
let PROG = {};
try { PROG = JSON.parse(localStorage.getItem(PROG_LSK) || "{}") || {}; } catch (e) { PROG = {}; }
function saveProg() { try { localStorage.setItem(PROG_LSK, JSON.stringify(PROG)); } catch (e) {} }
function hashStr(s) { let h = 5381; s = s || ""; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }
function ckFor(sec, item) { return item.key || (sec + "|" + (item.title || "") + "|" + (item.date || item.due || item.deadline || "")); }
function checkLabel(cardKey, itemId, labelText) {
  const lab = el("label", "lchk");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.className = "lcb";
  cb.dataset.card = cardKey;
  cb.dataset.item = itemId;
  cb.checked = !!PROG[cardKey + "::" + itemId];
  cb.addEventListener("change", () => {
    const k = cardKey + "::" + itemId;

/* ---------- 讀默 ---------- */
let speakingBtn = null;
function speakSeq(texts, lang, btn, prog) {
  if (!("speechSynthesis" in window)) { btn.textContent = "此瀏覽器不支援語音"; return; }
  if (speakingBtn === btn) { speechSynthesis.cancel(); speakingBtn = null; btn.textContent = btn.dataset.label; if (prog) prog.textContent = ""; return; }
  speechSynthesis.cancel();
  if (speakingBtn) speakingBtn.textContent = speakingBtn.dataset.label;
  speakingBtn = btn;
  btn.dataset.label = btn.textContent;
  btn.textContent = "⏹ 停止讀默";
  let i = 0;
  function alive() { return speakingBtn === btn; }
  function finish() { if (!alive()) return; speakingBtn = null; btn.textContent = btn.dataset.label; if (prog) prog.textContent = "✅ 讀默完成"; }
  function say(text, cb) { const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = 0.78; u.onend = cb; u.onerror = cb; speechSynthesis.speak(u); }
  function playItem() {
    if (!alive()) return;
    if (i >= texts.length) { finish(); return; }
    if (prog) prog.textContent = "🔊 讀默中：第 " + (i + 1) + " / " + texts.length + " 題";
    say(texts[i], () => setTimeout(() => { if (!alive()) return; say(texts[i], () => setTimeout(() => { i++; playItem(); }, 6000)); }, 2000));
  }
  playItem();
}
/* 單項讀默：只讀嗰一項，讀兩次（逐句/逐字用，唔使成串聽晒） */
let tapSeq = 0;
function sayTwice(text, lang, isAlive, onDone) {
  const say = (t, cb) => { const u = new SpeechSynthesisUtterance(t); u.lang = lang; u.rate = 0.78; u.onend = cb; u.onerror = cb; speechSynthesis.speak(u); };
  say(text, () => setTimeout(() => { if (!isAlive()) return; say(text, onDone || (() => {})); }, 900));
}
function speakSingle(text, lang, btn) {
  if (!("speechSynthesis" in window)) { btn.textContent = "此瀏覽器不支援語音"; return; }
  if (speakingBtn === btn) { speechSynthesis.cancel(); speakingBtn = null; btn.textContent = btn.dataset.label; return; }
  tapSeq++;
  speechSynthesis.cancel();
  if (speakingBtn) speakingBtn.textContent = speakingBtn.dataset.label;
  speakingBtn = btn;
  btn.dataset.label = btn.textContent;
  btn.textContent = "⏹";
  sayTwice(text, lang, () => speakingBtn === btn, () => { if (speakingBtn !== btn) return; speakingBtn = null; btn.textContent = btn.dataset.label; });
}
function speakTap(text, lang) {
  if (!("speechSynthesis" in window)) return;
  if (speakingBtn) { speakingBtn.textContent = speakingBtn.dataset.label; speakingBtn = null; }
  speechSynthesis.cancel();
  const my = ++tapSeq;
  sayTwice(text, lang, () => tapSeq === my);

function groupOf(p, mode) { return mode === "lesson" ? (p.lesson || "") : (p.subject || ""); }
function buildTabs(card, item) {
  const practice = item.practice || [];
  const words = item.words || [];
  const lessons = [...new Set([...words, ...practice].map(p => p.lesson).filter(Boolean))].sort();
  let mode = null, groups = [];
  if (lessons.length) { mode = "lesson"; groups = lessons; }

    const subs = [...new Set(practice.map(p => p.subject).filter(Boolean))];
    if (subs.length >= 2) { mode = "subject"; groups = subs; }
  }
  if (!mode) return null;
  const untagged = mode === "lesson"
    ? (words.some(w => !w.lesson) || practice.some(p => !p.lesson))
    : practice.some(p => !p.subject);
  const bar = el("div", "tabs");
  const labels = [...groups, ...(untagged ? ["綜合"] : []), "全部"];
  function applyTab(lab) {
    bar.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.lab === lab));
    card.querySelectorAll("[data-g]").forEach(elm => {
      const g = elm.getAttribute("data-g");
      elm.style.display = (lab === "全部" || g === lab || (lab === "綜合" && g === "")) ? "" : "none";
    });
  }
  labels.forEach(lab => {
    let cnt = 0;
    if (lab === "全部") cnt = words.length + practice.length;
    else if (lab === "綜合") cnt = [...words, ...practice].filter(p => !groupOf(p, mode)).length;
    else cnt = [...words, ...practice].filter(p => groupOf(p, mode) === lab).length;
    const b = el("button", "tab", lab + (cnt ? " (" + cnt + ")" : ""));

  if (pc) foot.appendChild(el("span", "pcount", "✏️ " + pc + " 題練習"));
  const wc = (item.words && item.words.length) || 0;
  if (wc) foot.appendChild(el("span", "pcount", "📝 " + wc + " 字詞"));
  const ps = el("span", "pcount progcnt");
  ps.setAttribute("data-prog-for", ck);
  ps.style.display = "none";
  foot.appendChild(ps);
  const btn = el("button", "toggle", c._expandLabel);
  btn.addEventListener("click", (e) => { e.stopPropagation(); toggleCard(c); });
  foot.appendChild(btn);
  c._toggleBtn = btn;
  c.appendChild(foot);
  const body = el("div", "cardbody");
  const bar = el("div", "progbar");
  bar.setAttribute("data-prog-wrap", ck);
  bar.style.display = "none";
  const cnt = el("span", "progcnt");
  cnt.setAttribute("data-prog-for", ck);
  bar.appendChild(cnt);
  const rb = el("button", "resetbtn", "↺ 重置進度");
  rb.addEventListener("click", () => resetProg(ck));
  bar.appendChild(rb);
  body.appendChild(bar);
  c.appendChild(body);
  const top = c.querySelector(".top");
  if (top) { top.style.cursor = "pointer"; top.addEventListener("click", () => toggleCard(c)); }
  return body;
}
function upcomingCard(item) {
  const c = cardShell("exam", (item.type ? item.type + "｜" : "") + (item.subject || "") + "：" + item.title, dueLabel(item), dueClass(item));
  c.id = "card-" + (cardSeq++); item._cid = c.id;
  c.appendChild(el("div", "meta", "📅 " + (item.date_display || item.date || "")));
  if (item.scope) {
    const s = el("div", "scope");
    s.appendChild(el("b", null, "範圍："));
    const segs = item.scope.split(/[｜|丨]/).map(x => x.trim()).filter(Boolean);
    if (segs.length <= 1) {
      s.appendChild(document.createTextNode((segs[0] || "").trim()));
    } else {
      segs.forEach(seg => s.appendChild(el("span", "sline", seg)));
    }
    c.appendChild(s);
  }

}
function homeworkCard(item) {

  c.id = "card-" + (cardSeq++); item._cid = c.id;

  const body = attachBody(c, item, { sec: "hw", expandLabel: "📋 睇指示 / 提示 ▼" });
  if (body) enrichmentHTML(body, item, { checkable: true, hintsCheck: true, cardKey: ckFor("hw", item) });
  return c;
}
function noticeCard(item) {
  const c = cardShell("notice", "📣 " + item.title, item.days_left != null ? dueLabel(item) : "", dueClass(item));
  c.id = "card-" + (cardSeq++); item._cid = c.id;
  const meta = el("div", "meta", "✍️ 未簽署" + (item.deadline_display ? "｜回條死線：" + item.deadline_display : ""));

  enrichmentHTML(c, item, { showTier: true, wrapDetail: true });
  return c;
}
function sectionWrap(sec, title) {
  const w = el("div", "secwrap");
  w.dataset.sec = sec;
  w.appendChild(el("h2", "sec", title));
  $app.appendChild(w);

}

let curFilter = "all";
function setFilter(f) {

  document.querySelectorAll("#topnav .navbtn[data-filter]").forEach(b => b.classList.toggle("on", b.dataset.filter === f));
  document.querySelectorAll(".secwrap").forEach(w => { w.style.display = (f === "all" || w.dataset.sec === f) ? "" : "none"; });
}
document.querySelectorAll("#topnav .navbtn[data-filter]").forEach(b => b.addEventListener("click", () => setFilter(b.dataset.filter)));
document.getElementById("collapseAll").addEventListener("click", collapseAllCards);
function remainText(dl) { return dl === 0 ? "今日到期！" : dl === 1 ? "聽日到期" : "仲有 " + dl + " 日"; }
function buildBanner(d) {
  const banner = document.getElementById("actionBanner");
  const rows = [];
  const push = (icon, text, item) => { if (item && item._cid) rows.push({ icon, text, id: item._cid }); };
  (d.upcoming || []).forEach(u => { if (u.days_left != null && u.days_left >= 0 && u.days_left <= 3) push("⏰", (u.subject || "") + "：" + u.title + "（" + remainText(u.days_left) + "）", u); });
  (d.homework || []).forEach(h => { if (h.days_left != null && h.days_left >= 0 && h.days_left <= 3) push("📝", "未交功課：" + (h.subject || "") + "：" + h.title + "（" + remainText(h.days_left) + "）", h); });
  ((d.notices && d.notices.items) || []).forEach(n => { if (n.days_left != null && n.days_left >= 0 && n.days_left <= 3) push("📢", "待簽通告：" + n.title + "（" + remainText(n.days_left) + "）", n); });
  if (!rows.length) { banner.style.display = "none"; return; }
  banner.appendChild(el("div", null, "🔥 近 3 日急件"));
  rows.forEach(r => {
    const line = el("span", "ab-item", r.icon + " " + r.text);
    line.addEventListener("click", () => openCardById(r.id));
    banner.appendChild(line);
  });
  banner.style.display = "block";
}

function byDue(a, b) {
  const da = a.days_left, db = b.days_left;
  const ea = da != null && da < 0, eb = db != null && db < 0;
  if (ea !== eb) return ea ? 1 : -1;
  return (da == null ? 9999 : da) - (db == null ? 9999 : db);
}
fetch("daughter-detail.json?t=" + Date.now())
  .then(r => r.json())
  .then(d => {
    (d.upcoming || []).forEach(fixDaysLeft);

    const examWrap = sectionWrap("exam", "⏰ 測驗・默書・評估");
    const ups = [...(d.upcoming || [])].sort(byDue);

    else examWrap.appendChild(el("div", "empty", "暫時冇測驗／默書／評估"));
    const hwWrap = sectionWrap("hw", "📚 未交功課");
    const hws = [...(d.homework || [])].sort(byDue);
    if (hws.length) hws.forEach(h => hwWrap.appendChild(homeworkCard(h)));
    else hwWrap.appendChild(el("div", "empty", "✅ 功課全部交齊"));
    const ntWrap = sectionWrap("notice", "📣 未簽通告");
    const nts = [...((d.notices && d.notices.items) || [])].sort(byDue);
    if (nts.length) nts.forEach(n => ntWrap.appendChild(noticeCard(n)));
    else ntWrap.appendChild(el("div", "empty", "✅ 冇未簽通告"));
    document.getElementById("cntExam").textContent = "(" + ups.length + ")";
    document.getElementById("cntHw").textContent = "(" + hws.length + ")";
    document.getElementById("cntNotice").textContent = "(" + nts.length + ")";
    buildBanner({ upcoming: ups, homework: hws, notices: d.notices });
    refreshProgCounts();
  })
  .catch(e => {
    document.getElementById("upd").textContent = "⚠️ 資料載入失敗，請稍後再開";
  });

<script>
/* ===== Interactive quiz demo: 第3課《心中的鈴鐺》 (trial, content from curriculum_kb) ===== */
const QUIZ_MC = [
  { q: "小熊搖着（　）鐺上廁所。", opts: ["玲", "鈴", "伶", "齡"], ans: 1, why: "「鈴鐺」是金字部 — 鈴鐺是金屬做的。", id: "mc1", label: "選擇題：鈴鐺的「鈴」" },
  { q: "「小熊很害怕，所以＿＿。」", opts: ["媽媽回去睡覺了", "讓鈴聲陪他上廁所", "天黑了", "他第二天又想上廁所"], ans: 1, why: "課文第③段：小熊說「我很害怕，所以讓鈴聲陪我上廁所。」", id: "mc2", label: "選擇題：所以句式" },
  { q: "小熊放下鈴鐺，因為他不想＿＿媽媽。", opts: ["陪", "起身", "吵醒", "害怕"], ans: 2, why: "課文第⑤段：「這樣不會吵醒媽媽。」", id: "mc3", label: "選擇題：不想吵醒媽媽" }
];
const QUIZ_MATCH = [["怕", "害怕"], ["拍", "拍手"], ["吵", "吵醒"], ["沙", "沙灘"]];
const QUIZ_MATCH_RIGHT = ["沙灘", "害怕", "吵醒", "拍手"];
const QUIZ_DRAG = [{ ch: "室", cat: "small" }, { ch: "熊", cat: "big" }, { ch: "露", cat: "small" }, { ch: "想", cat: "big" }, { ch: "客", cat: "small" }];
let qzBuilt = false;
const qz = { score: 0, total: 12, counted: {}, wrongOnce: [] };

function qzScoreUpd() { document.getElementById("qzScore").textContent = "⭐ " + qz.score + " / " + qz.total; }
function qzPoint(id, label) {
  if (qz.counted[id]) return;
  qz.counted[id] = true; qz.score++; qzScoreUpd();
}
function qzWrong(id, label) {
  if (!qz.counted[id] && !qz.wrongOnce.find(w => w.id === id)) qz.wrongOnce.push({ id: id, label: label });
}
function qzEl(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function buildQuiz() {
  if (qzBuilt) return; qzBuilt = true;
  const body = document.getElementById("qzBody");

  QUIZ_MC.forEach(item => {
    const card = qzEl("div", "qz-card");
    card.appendChild(qzEl("span", "qz-tag", "點選題 MC"));
    card.appendChild(qzEl("div", "qz-q", item.q));
    const opts = qzEl("div", "qz-opts");
    const fb = qzEl("div", "qz-fb");
    item.opts.forEach((o, i) => {
      const b = qzEl("button", "qz-opt", o);
      b.addEventListener("click", () => {
        if (qz.counted[item.id]) return;
        if (i === item.ans) { b.classList.add("right"); fb.className = "qz-fb ok"; fb.textContent = "✅ 啱！" + item.why; qzPoint(item.id, item.label); }
        else { b.classList.add("wrong"); fb.className = "qz-fb no"; fb.textContent = "❌ 唔係呢個，再諗諗！"; qzWrong(item.id, item.label); setTimeout(() => b.classList.remove("wrong"), 900); }
      });
      opts.appendChild(b);
    });
    card.appendChild(opts); card.appendChild(fb);
    body.appendChild(card);
  });

  // --- matching ---
  const mCard = qzEl("div", "qz-card");
  mCard.appendChild(qzEl("span", "qz-tag", "配對 Matching"));
  mCard.appendChild(qzEl("div", "qz-q", "形近字配詞語：先㩒左邊個字，再㩒右邊佢嘅詞語。"));
  const pairs = qzEl("div", "qz-pairs");
  const colL = qzEl("div", "qz-col"), colR = qzEl("div", "qz-col");
  const mFb = qzEl("div", "qz-fb");
  let selChar = null, selBtn = null;
  QUIZ_MATCH.forEach(pr => {
    const b = qzEl("button", "qz-chip", pr[0]);
    b.dataset.ch = pr[0];
    b.addEventListener("click", () => {
      if (b.classList.contains("done")) return;
      if (selBtn) selBtn.classList.remove("sel");
      selChar = pr[0]; selBtn = b; b.classList.add("sel");
    });
    colL.appendChild(b);
  });
  QUIZ_MATCH_RIGHT.forEach(w => {
    const b = qzEl("button", "qz-chip", w);
    b.addEventListener("click", () => {
      if (b.classList.contains("done") || !selChar) return;
      const pair = QUIZ_MATCH.find(p => p[0] === selChar);
      const id = "match-" + selChar;
      if (pair && pair[1] === w) {
        b.classList.add("done"); selBtn.classList.add("done"); selBtn.classList.remove("sel");
        mFb.className = "qz-fb ok"; mFb.textContent = "✅ " + selChar + " → " + w + "，配對成功！";
        qzPoint(id, "配對：" + selChar + "→" + w); selChar = null; selBtn = null;
      } else {
        mFb.className = "qz-fb no"; mFb.textContent = "❌ 「" + selChar + "」唔係配「" + w + "」，再試！";
        qzWrong(id, "配對：" + selChar);
      }
    });
    colR.appendChild(b);
  });
  pairs.appendChild(colL); pairs.appendChild(colR);
  mCard.appendChild(pairs); mCard.appendChild(mFb);
  body.appendChild(mCard);

  // --- drag & drop classification ---
  const dCard = qzEl("div", "qz-card");
  dCard.appendChild(qzEl("span", "qz-tag", "拖放 Drag & Drop"));
  dCard.appendChild(qzEl("div", "qz-q", "上下結構分類：把字拖入正確的籃（或者㩒住個字，再㩒個籃）。"));
  const tray = qzEl("div", "qz-tray");
  const baskets = qzEl("div", "qz-baskets");
  const dFb = qzEl("div", "qz-fb");
  let dragChip = null, selChip = null;
  function placeChip(chip, basket) {
    const cat = basket.dataset.cat, want = chip.dataset.cat, id = "drag-" + chip.dataset.ch;
    if (cat === want) {
      basket.appendChild(chip); chip.classList.add("done"); chip.classList.remove("sel");
      dFb.className = "qz-fb ok"; dFb.textContent = "✅ 「" + chip.dataset.ch + "」放啱咗！";
      qzPoint(id, "上下結構：" + chip.dataset.ch);
      if (selChip === chip) selChip = null;
    } else {
      chip.classList.add("wrongin"); dFb.className = "qz-fb no";
      dFb.textContent = "❌ 「" + chip.dataset.ch + "」唔屬於呢一組，再諗諗佢上下邊部分大啲！";
      qzWrong(id, "上下結構：" + chip.dataset.ch);
      setTimeout(() => { chip.classList.remove("wrongin"); if (chip.parentElement !== tray) tray.appendChild(chip); }, 950);
    }
  }
  [["big", "上大下小"], ["small", "上小下大"]].forEach(cfg => {
    const bk = qzEl("div", "qz-basket"); bk.dataset.cat = cfg[0];
    bk.appendChild(qzEl("h4", null, cfg[1]));
    bk.addEventListener("click", () => { if (selChip && selChip.parentElement === tray) placeChip(selChip, bk); });
    baskets.appendChild(bk);
  });
  QUIZ_DRAG.forEach(d => {
    const chip = qzEl("div", "qz-chip", d.ch);
    chip.dataset.ch = d.ch; chip.dataset.cat = d.cat;
    chip.addEventListener("pointerdown", ev => {
      if (chip.classList.contains("done")) return;
      ev.preventDefault();
      const startX = ev.clientX, startY = ev.clientY; let moved = false;
      const r = chip.getBoundingClientRect();
      chip.setPointerCapture(ev.pointerId);
      function mv(e2) {
        if (!moved && Math.hypot(e2.clientX - startX, e2.clientY - startY) > 7) {
          moved = true; dragChip = chip; chip.classList.add("dragging");
          chip.style.position = "fixed"; chip.style.zIndex = "1300";
          chip.style.width = r.width + "px"; chip.style.left = r.left + "px"; chip.style.top = r.top + "px";
        }
        if (moved) { chip.style.left = (e2.clientX - r.width / 2) + "px"; chip.style.top = (e2.clientY - r.height / 2) + "px";
          document.querySelectorAll(".qz-basket").forEach(bk => { const br = bk.getBoundingClientRect(); bk.classList.toggle("over", e2.clientX >= br.left && e2.clientX <= br.right && e2.clientY >= br.top && e2.clientY <= br.bottom); }); }
      }
      function up(e2) {
        chip.removeEventListener("pointermove", mv); chip.removeEventListener("pointerup", up); chip.removeEventListener("pointercancel", up);
        document.querySelectorAll(".qz-basket").forEach(bk => bk.classList.remove("over"));
        if (moved) {
          chip.classList.remove("dragging"); chip.style.position = ""; chip.style.zIndex = ""; chip.style.width = ""; chip.style.left = ""; chip.style.top = "";
          let placed = false;
          document.querySelectorAll(".qz-basket").forEach(bk => { const br = bk.getBoundingClientRect(); if (!placed && e2.clientX >= br.left && e2.clientX <= br.right && e2.clientY >= br.top && e2.clientY <= br.bottom) { placeChip(chip, bk); placed = true; } });
          dragChip = null;
        } else {
          if (selChip) selChip.classList.remove("sel");
          selChip = chip; chip.classList.add("sel");
          dFb.className = "qz-fb"; dFb.textContent = "揀咗「" + d.ch + "」，㩒一個籃放佢入去。";
        }
      }
      chip.addEventListener("pointermove", mv); chip.addEventListener("pointerup", up); chip.addEventListener("pointercancel", up);
    });
    tray.appendChild(chip);
  });
  dCard.appendChild(tray); dCard.appendChild(baskets); dCard.appendChild(dFb);
  body.appendChild(dCard);

  // --- drawing / tracing ---
  const wCard = qzEl("div", "qz-card");
  wCard.appendChild(qzEl("span", "qz-tag", "畫畫・寫字 Drawing"));
  wCard.appendChild(qzEl("div", "qz-q", "跟住灰色嘅字，寫一個「鈴」字；或者畫出你心中的鈴鐺。"));
  const box = qzEl("div", "qz-drawbox");
  box.appendChild(qzEl("div", "qz-guide", "鈴"));
  const cv = document.createElement("canvas"); cv.id = "qzCanvas"; cv.width = 264; cv.height = 264;
  box.appendChild(cv); wCard.appendChild(box);
  const row = qzEl("div", "qz-row");
  const clr = qzEl("button", "qz-btn alt", "🧹 清除重寫");
  clr.addEventListener("click", () => { const ctx = cv.getContext("2d"); ctx.clearRect(0, 0, cv.width, cv.height); });
  row.appendChild(clr); wCard.appendChild(row);
  body.appendChild(wCard);
  const ctx = cv.getContext("2d"); ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.strokeStyle = "#FDE68A";
  let drawing = false, lastPt = null;
  function ptOf(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) }; }
  cv.addEventListener("pointerdown", e => { e.preventDefault(); drawing = true; lastPt = ptOf(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if (!drawing) return; const p = ptOf(e); ctx.beginPath(); ctx.moveTo(lastPt.x, lastPt.y); ctx.lineTo(p.x, p.y); ctx.stroke(); lastPt = p; });
  ["pointerup", "pointercancel"].forEach(t => cv.addEventListener(t, () => { drawing = false; }));

  // --- self-check reveal (Level 2 style) ---
  const rCard = qzEl("div", "qz-card");
  rCard.appendChild(qzEl("span", "qz-tag", "諗深一層・自我核對"));
  rCard.appendChild(qzEl("div", "qz-q", "為甚麼小熊在第二天晚上，拿起鈴鐺後又把它放下？（先自己講出嚟，再睇答案）"));
  const rBtn = qzEl("button", "qz-btn", "👀 睇參考答案");
  const rAns = qzEl("div", "qz-answer", "因為他想到媽媽會被鈴聲吵醒。他體貼媽媽，所以放下鈴鐺，改在心中搖鈴鐺 — 這樣不會吵醒媽媽，自己也不會害怕。");
  rBtn.addEventListener("click", () => { rAns.style.display = rAns.style.display === "block" ? "none" : "block"; });
  rCard.appendChild(rBtn); rCard.appendChild(rAns);
  body.appendChild(rCard);

  // --- finish / summary ---
  const fin = qzEl("button", "qz-btn", "🏁 完成！睇成績");
  fin.style.width = "100%"; fin.style.padding = "14px";
  const sum = qzEl("div", "qz-summary");
  fin.addEventListener("click", () => {
    try { localStorage.setItem("quizDemoL3", JSON.stringify({ score: qz.score, wrong: qz.wrongOnce.map(w => w.label), at: new Date().toISOString() })); } catch (e) {}
    sum.style.display = "block";
    sum.innerHTML = "";
    sum.appendChild(qzEl("div", null, "⭐ 成績：" + qz.score + " / " + qz.total));
    if (qz.wrongOnce.length) {
      sum.appendChild(qzEl("div", null, "第一次答錯咗（之後改啱都好叻！）："));
      qz.wrongOnce.forEach(w => sum.appendChild(qzEl("div", null, "・" + w.label)));
      sum.appendChild(qzEl("div", null, "（錯題已存喺呢部裝置；正式版會傳返俾家長同 Muse 入錯題庫。）"));
    } else sum.appendChild(qzEl("div", null, "🎉 全部第一次就答啱，勁！"));
    sum.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  body.appendChild(fin); body.appendChild(sum);
  qzScoreUpd();
}

document.getElementById("quizOpenBtn").addEventListener("click", () => {
  buildQuiz();
  document.getElementById("quizModal").style.display = "block";
  document.body.style.overflow = "hidden";
});
document.getElementById("quizCloseBtn").addEventListener("click", () => {
  document.getElementById("quizModal").style.display = "none";
  document.body.style.overflow = "";
});
</script>
