let tapSeq = 0;
function sayTwice(text, lang, isAlive, onDone) {
  const say = (t, cb) => { const u = new SpeechSynthesisUtterance(t); u.lang = lang; u.rate = 0.78; u.onend = cb; u.onerror = cb; speechSynthesis.speak(u); };
  say(text, () => setTimeout(() => { if (!isAlive()) return; say(text, onDone || (() => {})); }, 900));
}
function speakSingle(text, lang, btn) {
  if (!("speechSynthesis" in window)) { btn.textContent = "此瀏覽器不支援語音"; return; }
  if (speakingBtn === btn) { speechSynthesis.cancel(); speakingBtn = null; btn.textContent = btn.dataset.label; return; }
  tapSeq++;
  speechSynthesis.cancel();
  if (speakingBtn) speakingBtn.textContent = speakingBtn.dataset.label;
  speakingBtn = btn;
  btn.dataset.label = btn.textContent;
  btn.textContent = "⏹";
  sayTwice(text, lang, () => speakingBtn === btn, () => { if (speakingBtn !== btn) return; speakingBtn = null; btn.textContent = btn.dataset.label; });
}
function speakTap(text, lang) {
  if (!("speechSynthesis" in window)) return;
  if (speakingBtn) { speakingBtn.textContent = speakingBtn.dataset.label; speakingBtn = null; }
  speechSynthesis.cancel();
  const my = ++tapSeq;
  sayTwice(text, lang, () => tapSeq === my);
}

/* ---------- 分頁 (tabs) ---------- */
function normPractice(p) { if (typeof p === "string") return { q: p }; if (p && p.text && !p.q) return { q: p.text, guide: p.guide, a: p.a || "" }; return p; }
function groupOf(p, mode) { return mode === "lesson" ? (p.lesson || "") : (p.subject || ""); }
function buildTabs(card, item) {
  const practice = item.practice || [];
  const words = item.words || [];
  const lessons = [...new Set([...words, ...practice].map(p => p.lesson).filter(Boolean))].sort();
  let mode = null, groups = [];
  if (lessons.length) { mode = "lesson"; groups = lessons; }
  else {
    const subs = [...new Set(practice.map(p => p.subject).filter(Boolean))];
    if (subs.length >= 2) { mode = "subject"; groups = subs; }
  }
  if (!mode) return null;
  const untagged = mode === "lesson"
    ? (words.some(w => !w.lesson) || practice.some(p => !p.lesson))
    : practice.some(p => !p.subject);
  const bar = el("div", "tabs");
  const labels = [...groups, ...(untagged ? ["綜合"] : []), "全部"];
  function applyTab(lab) {
    bar.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.lab === lab));
    card.querySelectorAll("[data-g]").forEach(elm => {
      const g = elm.getAttribute("data-g");
      elm.style.display = (lab === "全部" || g === lab || (lab === "綜合" && g === "")) ? "" : "none";
    });
  }
  labels.forEach(lab => {
    let cnt = 0;
    if (lab === "全部") cnt = words.length + practice.length;
    else if (lab === "綜合") cnt = [...words, ...practice].filter(p => !groupOf(p, mode)).length;
    else cnt = [...words, ...practice].filter(p => groupOf(p, mode) === lab).length;
    const b = el("button", "tab", lab + (cnt ? " (" + cnt + ")" : ""));
    b.dataset.lab = lab;
    b.addEventListener("click", () => applyTab(lab));
    bar.appendChild(b);
  });
  card._tabMode = mode;
  card._applyTab = applyTab;
  card._defaultTab = labels[0];
  return bar;
}

function isTaskQ(p) { const t = (p.q || "") + (p.a || ""); return /家長|朗讀|讀出|背誦|重讀課文/.test(t); }
function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function qExtra(p) {
  const q = p.q || "";
  if (q.indexOf("<") >= 0) return "";
  if (/=\s*\?\s*$/.test(q) || q.indexOf("直式") >= 0) return '<div class="ws-work"><br><br><br></div>';
  if (q.indexOf("______") >= 0 || q.indexOf("（　）") >= 0 || q.indexOf("（ ）") >= 0 || q.indexOf("( )") >= 0) return "";
  const a = p.a || "";
  const n = a.length > 28 ? 3 : (a.length > 10 ? 2 : 1);
  let s = '<div class="ws-lines">';
  for (let i = 0; i < n; i++) s += '<div class="ws-line"></div>';
  return s + "</div>";
}
function buildSheet(item) {
  const title = (item.subject ? item.subject + "：" : "") + (item.title || "練習");
  let h = "<h1>" + esc(title) + " 工作紙</h1>";
  h += '<div class="wsmeta"><span>姓名：____________</span><span>日期：____________</span><span>成績：________</span></div>';
  if (item.scope) h += '<div style="font-size:13.5px;color:#444;margin-bottom:6px">範圍：' + esc(item.scope) + "</div>";
  if (item.words && item.words.length) {
    h += "<h3>一、字詞練寫（先讀一次，再喺格仔度寫）</h3>";
    item.words.forEach(w => {
      const t = w.text || "";
      let practiceArea;
      if (/[㐀-鿿]/.test(t)) {
        const chars = [...t.replace(/\s/g, "")];
        practiceArea = chars.map(() => '<span class="ws-cellgroup">' + '<span class="ws-cell"></span><span class="ws-cell"></span>' + "</span>").join("");
      } else {
        practiceArea = '<span class="ws-wline"></span><span class="ws-wline"></span>';
      }
      h += '<div class="ws-wordrow"><span class="ws-word">' + esc(t) + (w.meaning ? ' <span style="font-weight:400;font-size:13px;color:#555">(' + esc(w.meaning) + ")</span>" : "") + "</span>" + practiceArea + "</div>";
    });
  }
  const qs = (item.practice || []).filter(p => !isTaskQ(p));
  const multiSub = [...new Set(qs.map(p => p.subject).filter(Boolean))].length >= 2;
  if (qs.length) {
    h += "<h3>" + (item.words && item.words.length ? "二" : "一") + "、練習題</h3>";
    let curG = null;
    qs.forEach((p, i) => {
      const g = p.subject || p.lesson || "";
      if (multiSub && g && g !== curG) { curG = g; h += '<div style="font-weight:900;margin:10px 0 4px">📚 ' + esc(g) + "</div>"; }
      const qhtml = (p.q || "").indexOf("<") >= 0 ? p.q : esc(p.q);
      h += '<div class="wsq"><span class="qn">' + (i + 1) + ".</span> " + qhtml + qExtra(p) + "</div>";
    });
    h += '<div class="ws-answers"><h3>🔑 家長核對答案（列印時自動另開一頁）</h3>';
    qs.forEach((p, i) => {
      h += '<div class="wsq">' + (i + 1) + ". " + (multiSub && p.subject ? "[" + esc(p.subject) + "] " : "") + esc(p.a || "") + "</div>";
    });
    h += "</div>";
  }
  return h;
}

          chip.classList.remove("dragging"); chip.style.position = ""; chip.style.zIndex = ""; chip.style.width = ""; chip.style.left = ""; chip.style.top = "";
          let placed = false;
          card.querySelectorAll(".qz-basket").forEach(bk => { const br = bk.getBoundingClientRect(); if (!placed && e2.clientX >= br.left && e2.clientX <= br.right && e2.clientY >= br.top && e2.clientY <= br.bottom) { placeChip(chip, bk); placed = true; } });
        } else {
          if (selChip) selChip.classList.remove("sel");
          selChip = chip; chip.classList.add("sel");
          fb.className = "qz-fb"; fb.textContent = "揀咗「" + d.ch + "」，㩒一個籃放佢入去。";
        }
      }
      chip.addEventListener("pointermove", mv); chip.addEventListener("pointerup", up); chip.addEventListener("pointercancel", up);
    });
  });
  card.appendChild(tray); card.appendChild(baskets);
}
function qzRenderOrder(item, card, fb) {
  const line = qzEl("div", "qz-orderline");
  const tray = qzEl("div", "qz-tray");
  const placed = [];
  function mkChip(txt) {
    const c = qzEl("div", "qz-chip", txt);
    c.addEventListener("click", () => {
      if (item._done || qzLocked) return;
      if (c.parentElement === tray) { line.appendChild(c); placed.push(txt); }
      else { tray.appendChild(c); const ix = placed.indexOf(txt); if (ix >= 0) placed.splice(ix, 1); }
      fb.textContent = "";
    });
    return c;
  }
  item.shuffled.forEach(t => tray.appendChild(mkChip(t)));
  const row = qzEl("div", "qz-row");
  const chk = qzEl("button", "qz-btn", "✔️ 檢查");
  chk.addEventListener("click", () => {
    if (item._done || qzLocked) return;
    if (placed.length < item.parts.length) { fb.className = "qz-fb no"; fb.textContent = "仲未排完呀，把所有詞語放上句子框先！"; return; }
    if (JSON.stringify(placed) === JSON.stringify(item.parts)) {
      item._done = true; fb.className = "qz-fb ok"; fb.textContent = "✅ " + QZ_PRAISE[qzPraiseIx++ % QZ_PRAISE.length] + "「" + item.parts.join("") + "。」";
      line.querySelectorAll(".qz-chip").forEach(c => c.classList.add("done")); qzGain(item);
    } else { fb.className = "qz-fb no"; fb.textContent = "💪 " + qzEncourage() + "邊句是原因、邊句是結果？㩒句子框的詞語可以放回下面。"; qzWrong(item); }
  });
  row.appendChild(chk);
  if (item._done) { item.parts.forEach(t => { const c = qzEl("div", "qz-chip done", t); line.appendChild(c); }); fb.className = "qz-fb ok"; fb.textContent = "✅ 已完成"; }
  card.appendChild(line); card.appendChild(tray); card.appendChild(row);
}
function qzRenderDraw(item, card, fb) {
  const box = qzEl("div", "qz-drawbox");
  box.appendChild(qzEl("div", "qz-guide", item.guide));
  const cv = document.createElement("canvas"); cv.id = "qzCanvas"; cv.width = 264; cv.height = 264;
  box.appendChild(cv); card.appendChild(box);
  const row = qzEl("div", "qz-row");
  const clr = qzEl("button", "qz-btn alt", "🧹 清除重寫");
  clr.addEventListener("click", () => { cv.getContext("2d").clearRect(0, 0, cv.width, cv.height); });
  row.appendChild(clr); card.appendChild(row);
  const ctx = cv.getContext("2d"); ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.strokeStyle = "#FDE68A";
  let drawing = false, lastPt = null;
  function ptOf(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) }; }
  cv.addEventListener("pointerdown", e => { e.preventDefault(); drawing = true; lastPt = ptOf(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if (!drawing) return; const p = ptOf(e); ctx.beginPath(); ctx.moveTo(lastPt.x, lastPt.y); ctx.lineTo(p.x, p.y); ctx.stroke(); lastPt = p; });
  ["pointerup", "pointercancel"].forEach(t => cv.addEventListener(t, () => { drawing = false; }));
  fb.className = "qz-fb"; fb.textContent = "自由練習，唔計分 — 畫完㩒「下一題」繼續。隨時可以㩒右上角 ✕ 停低，進度已經存好。";
}
function qzRenderReveal(item, card, fb) {
  const row = qzEl("div", "qz-row");
  const b = qzEl("button", "qz-btn", "👀 睇參考答案");
  const ans = qzEl("div", "qz-answer", item.answer);
  b.addEventListener("click", () => { ans.style.display = ans.style.display === "block" ? "none" : "block"; });
  row.appendChild(b); card.appendChild(row); card.appendChild(ans);
}
function qzSkillSummary(cardEl) {
  const bySkill = {};
  qzItems().forEach(it => {
    const s = it.skill || "其他";
    bySkill[s] = bySkill[s] || { wrong: false, done: 0, total: 0 };
    if (it._wrongKeys && Object.keys(it._wrongKeys).length) bySkill[s].wrong = true;
    if (qzMax(it) > 0) { bySkill[s].total++; if (qzComplete(it)) bySkill[s].done++; }
  });
  const wrap = qzEl("div", "qz-skills");
  wrap.appendChild(qzEl("div", null, "今次練咗嘅本事："));
  Object.keys(bySkill).forEach(s => {
    const v = bySkill[s];
    let icon, cls;
    if (v.wrong) {
      const wrongItems = qzItems().filter(it => (it.skill || "其他") === s && it._wrongKeys && Object.keys(it._wrongKeys).length);
      const allRetried = wrongItems.length && wrongItems.every(it => it._retried);
      icon = allRetried ? "✓ 已再練掌握" : "✗ 要再練"; cls = allRetried ? "ok" : "bad";
    } else { icon = (v.total === 0 || v.done === v.total) ? "✓ 掌握" : "… 練緊"; cls = icon.indexOf("✓") === 0 ? "ok" : ""; }
    wrap.appendChild(qzEl("span", "qz-pill " + cls, s + " " + icon));
  });
  cardEl.appendChild(wrap);
}
function qzFinishCard() {
  const S = QZ[qzSetName], t = qzTotals();
  const card = qzEl("div", "qz-summary qz-enter");
  const doneCount = qzItems().filter(it => qzMax(it) > 0 && qzComplete(it)).length;
  const scoredCount = qzItems().filter(it => qzMax(it) > 0).length;
  if (qzSetName === "retry") {
    card.appendChild(qzEl("div", null, "🏁 錯題再練完成！（練習模式，唔再加星）"));
    card.appendChild(qzEl("div", null, "完成咗 " + doneCount + " / " + scoredCount + " 題錯題 — 返去原本嗰版，錯題會標住「已再練 ✓」。"));
  } else {
    card.appendChild(qzEl("div", null, "🏁 " + S.label + "完成！"));
    card.appendChild(qzEl("div", null, "⭐ " + qzStars() + " 粒星（首次答啱）・✅ 完成 " + doneCount + " / " + scoredCount + " 題"));
  }
  const wrong = S._wrong || [];
  try { localStorage.setItem(qzBase() + ":" + qzSetName, JSON.stringify({ stars: qzStars(), score: t[0], total: t[1], wrong: wrong, at: new Date().toISOString() })); } catch (e) {}
  qzSkillSummary(card);
  if (wrong.length) {
    card.appendChild(qzEl("div", null, "首次答錯（之後改啱都好叻）— 呢啲係「要再練」清單："));
    wrong.forEach(w => {
      const it = qzItems().find(x => w === x.label || w.indexOf(x.label + "：") === 0);
      card.appendChild(qzEl("div", null, "・" + w + (it && it._retried ? "（已再練 ✓）" : "")));
    });
  } else card.appendChild(qzEl("div", null, "🎉 全部第一次就答啱，勁！"));
  const row = qzEl("div", "qz-row");
  if (wrong.length && qzSetName !== "retry") {
    const rb = qzEl("button", "qz-btn", "🔁 再練錯題（" + qzWrongItemCount() + " 題）");
    rb.addEventListener("click", qzStartRetry);
    row.appendChild(rb);
  }
  if (qzSetName === "retry") {
    const back = qzEl("button", "qz-btn", "↩️ 返去" + (QZ[S._from] ? QZ[S._from].label : "簡易版"));
    back.addEventListener("click", () => qzSwitchSet(S._from || "easy"));
    row.appendChild(back);
  }
  const again = qzEl("button", "qz-btn alt", "🔄 重新開始呢一版");
  again.addEventListener("click", () => { const from = S._from; qzResetSet(qzSetName); if (qzSetName === "retry") qzSwitchSet(from || "easy"); else qzGo(0); });
  row.appendChild(again);
  if (qzSetName === "easy") {
    const nx = qzEl("button", "qz-bigbtn", wrong.length === 0 ? "🎉 挑戰成功！去玩正常版 ▶" : "➡️ 試下正常版 ▶");
    nx.addEventListener("click", () => qzSwitchSet("normal"));
    card.appendChild(nx);
  }
  card.appendChild(row);
  return card;
}
function qzWrongItemCount() {
  return QZ[qzSetName].items.filter(it => it._wrongKeys && Object.keys(it._wrongKeys).length).length;
}
function qzStartRetry() {
  const from = qzSetName, src = QZ[from];
  const clones = src.items.filter(it => it._wrongKeys && Object.keys(it._wrongKeys).length)
    .map(it => { const c = Object.assign({}, it); c._earned = 0; c._done = false; c._stars = 0; c._matched = {}; c._placed = {}; c._wrongKeys = {}; c._orig = it; return c; });
  if (!clones.length) return;
  QZ.retry = { label: "錯題再練", items: clones, _wrong: [], _from: from };
  qzSetName = "retry";
  document.getElementById("qzTabEasy").classList.remove("on");
  document.getElementById("qzTabNormal").classList.remove("on");
  qzGo(0);
}
function qzResetSet(name) {
  const S = QZ[name]; S._wrong = [];
  S.items.forEach(it => { it._earned = 0; it._done = false; it._stars = 0; it._retried = false; it._matched = {}; it._placed = {}; it._wrongKeys = {}; });
}
function qzPackState() {
  function pack(name) {
    const S = QZ[name];
    return S.items.map(it => {
      const rec = { e: it._earned || 0 };
      if (it._done) rec.d = 1;
      if (it._stars) rec.s = it._stars;
      if (it._retried) rec.r = 1;
      const wk = it._wrongKeys ? Object.keys(it._wrongKeys) : [];
      if (wk.length) rec.w = wk.map(k => k === it.label ? "" : k.slice(it.label.length + 1));
      const mk = it._matched ? Object.keys(it._matched) : [];
      if (mk.length) rec.m = mk;
      if (it._placed && Object.keys(it._placed).length) rec.p = it._placed;
      return rec;
    });
  }
  return { v: 1, easy: pack("easy"), normal: pack("normal") };
}
function qzSaveProgress() {
  try { localStorage.setItem(qzBase() + ":progress", JSON.stringify(qzPackState())); } catch (e) {}
}
function qzRestoreProgress() {
  try {
    const raw = localStorage.getItem(qzBase() + ":progress");
    if (raw) qzApplyState(JSON.parse(raw));
  } catch (e) {}
}
function qzApplyState(data) {
  try {
    if (!data || data.v !== 1) return false;
    ["easy", "normal"].forEach(name => {
      const arr = data[name], S = QZ[name];
      if (!Array.isArray(arr) || arr.length !== S.items.length) return;
      S._wrong = [];
      arr.forEach((rec, i) => {
        const it = S.items[i];
        it._earned = rec.e || 0; it._done = !!rec.d; it._stars = rec.s || 0; it._retried = !!rec.r;
        it._wrongKeys = {}; (rec.w || []).forEach(sub => { const k = sub === "" ? it.label : (sub.indexOf(it.label) === 0 ? sub : it.label + "：" + sub); it._wrongKeys[k] = true; S._wrong.push(k); });
        it._matched = {}; if (rec.m) rec.m.forEach(ch => { const pr = (it.pairs || []).find(p => p[0] === ch); if (pr) it._matched[ch] = pr[1]; });
        it._placed = rec.p || {};
      });
    });
    qzScoreUpd();
    return true;
  } catch (e) { return false; }
}
function qzRenderDots() {
  const box = document.getElementById("qzDots");
  if (!box) return;
  box.innerHTML = "";
  qzItems().forEach((it, i) => {
    const b = qzEl("button", "qz-dot", String(i + 1));
    if (i === qzIdx) b.classList.add("cur");
    if (qzComplete(it)) b.classList.add("done");
    else if (it._wrongKeys && Object.keys(it._wrongKeys).length) b.classList.add("tried");
    b.addEventListener("click", () => qzGo(i));
    box.appendChild(b);
  });
  const fin = qzEl("button", "qz-dot", "🏁");
  if (qzIdx >= qzItems().length) fin.classList.add("cur");
  fin.addEventListener("click", () => qzGo(qzItems().length));
  box.appendChild(fin);
}
window.qzOpen = function (id, itemKey) {
  qzCtx = { itemKey: itemKey || "CHI_PROGRESS_1", lessonId: id || "chi_l3" };
  if (QZ_LESSONS[qzCtx.lessonId]) QZ = QZ_LESSONS[qzCtx.lessonId];
  qzMigrateLegacy();
  qzBuilt = true;
  qzRestoreProgress();
  qzSwitchSet("easy");
  document.getElementById("quizModal").style.display = "flex";
  document.body.style.overflow = "hidden";
};
const _qzOb = document.getElementById("quizOpenBtn");
if (_qzOb) _qzOb.addEventListener("click", () => window.qzOpen("chi_l3", "CHI_PROGRESS_1"));
document.getElementById("quizCloseBtn").addEventListener("click", () => {
  document.getElementById("quizModal").style.display = "none";
  document.body.style.overflow = "";
  if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) {}
});
document.getElementById("qzPrev").addEventListener("click", () => qzGo(qzIdx - 1));
document.getElementById("qzNext").addEventListener("click", () => qzGo(qzIdx + 1));
document.getElementById("qzTabEasy").addEventListener("click", () => qzSwitchSet("easy"));
document.getElementById("qzTabNormal").addEventListener("click", () => qzSwitchSet("normal"));
function qzSwitchSet(name) {
  qzSetName = name;
  document.getElementById("qzTabEasy").classList.toggle("on", name === "easy");
  document.getElementById("qzTabNormal").classList.toggle("on", name === "normal");
  qzGo(0);
}
