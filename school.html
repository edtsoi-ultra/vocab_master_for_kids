  btn.dataset.label = btn.textContent;

function isTaskQ(p) { const t = (p.q || "") + (p.a || ""); return /家長|朗讀|讀出|背誦|重讀課文/.test(t); }

function qExtra(p) {

function qzToggleReview() {
  const panel = document.getElementById("qzReview");
  if (!panel) return;
  if (panel.style.display !== "none" && panel.style.display !== "") {
    panel.style.display = "none";
    document.querySelectorAll(".qz-reviewbtn").forEach(b => b.classList.remove("on"));
    return;
  }
  const r = QZ_REVIEW[qzCtx.lessonId];
  if (!r) { panel.innerHTML = "<h4>📖 重點</h4><p>呢一課暫時未有重點回顧。</p>"; }
  else {
    const pts = "<ul>" + r.points.map(p => "<li>" + p + "</li>").join("") + "</ul>";
    if (r.text) {
      panel.innerHTML = "<h4>📖 " + r.title + "</h4><div class=\"qz-revtabs\"><button class=\"qz-revtab on\" data-t=\"pts\">重點</button><button class=\"qz-revtab\" data-t=\"txt\">課文內容</button></div><div class=\"qz-revpts\">" + pts + "</div><div class=\"qz-revtxt\" style=\"display:none\"></div>";
      panel.querySelector(".qz-revtxt").textContent = r.text;
      panel.querySelectorAll(".qz-revtab").forEach(tb => tb.addEventListener("click", () => {
        panel.querySelectorAll(".qz-revtab").forEach(x => x.classList.toggle("on", x === tb));
        panel.querySelector(".qz-revpts").style.display = tb.dataset.t === "pts" ? "" : "none";
        panel.querySelector(".qz-revtxt").style.display = tb.dataset.t === "txt" ? "" : "none";
      }));
    } else {
      panel.innerHTML = "<h4>📖 " + r.title + "</h4>" + pts;
    }
  }
  panel.style.display = "block";
  document.querySelectorAll(".qz-reviewbtn").forEach(b => b.classList.add("on"));
}
